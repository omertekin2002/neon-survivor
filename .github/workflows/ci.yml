name: CI

on:
  push:
  pull_request:
  # pages.yml calls this so the deploy gate runs exactly this suite.
  workflow_call:

permissions:
  contents: read

# In a called workflow `github.workflow` is the caller's name, so a Pages run's
# tests get their own group and never cancel (or wait on) the plain CI run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps --only-shell chromium
      - run: bun run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
